name: 自动同步原作者更新

on:
  schedule:
    - cron: '0 0 * * *'  # 每天0点自动同步
  workflow_dispatch:      # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取当前仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置Git身份
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: 添加上游仓库
        run: git remote add upstream https://github.com/mtvpls/MoonTVPlus.git

      - name: 拉取上游更新
        run: git fetch upstream main

      - name: 合并上游更新
        run: git merge upstream/main --allow-unrelated-histories || echo "合并冲突，跳过本次同步"

      - name: 推送更新到自己仓库
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
